[pytest]
testpaths = tests
pythonpath = .
addopts = -ra --strict-markers --strict-config
# "legacy" (xunit1) keeps per-test <properties>, which carry requirement IDs
# into the JUnit XML for the traceability report. Jenkins and GitHub both
# read this format.
junit_family = legacy
junit_suite_name = cubesat-sil-verification
markers =
    req(*ids): requirement IDs (tests/requirements.json) verified by this test
    boundary: boundary-value test of a threshold or limit
    negative: negative test (invalid input, illegal transition, error path)
    fault_injection: data-driven fault-injection scenario
    regression: golden-output or determinism regression test
